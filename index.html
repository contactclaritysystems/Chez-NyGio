<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E63B2E">
<meta name="apple-mobile-web-app-title" content="Chez NyGio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Chez NyGio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6EA;--surface:#FFFFFF;--tile:#FFF0DC;--ink:#3B1F12;--ink2:#8A6048;--line:#F1DFC6;--red:#E63B2E;--red-d:#B8261B;--mustard:#FFC93C;--mustard-d:#DDA214;--green:#2F9E44;--green-d:#237A33;--lip:rgba(59,31,18,.13);--onsel:#FFF0EE;--readybg:#E7F7EA;
--fd:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1410;--surface:#2A1D16;--tile:#3A2A20;--ink:#FFF1E4;--ink2:#D5B89E;--line:#46332A;--lip:rgba(0,0,0,.4);--onsel:#4A2620;--readybg:#1F3A26}}
:root[data-theme="dark"]{--bg:#1D1410;--surface:#2A1D16;--tile:#3A2A20;--ink:#FFF1E4;--ink2:#D5B89E;--line:#46332A;--lip:rgba(0,0,0,.4);--onsel:#4A2620;--readybg:#1F3A26}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:700;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{user-select:text;-webkit-user-select:text;font:inherit}
svg{display:block;width:100%;height:100%}
:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
html,body,*{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:2px solid var(--line);min-height:70px;z-index:5}
.hdr.red{background:var(--red);border-color:var(--red);color:#fff}
.hdr.red .brand{visibility:hidden}
.icon-btn{flex:none;width:50px;height:50px;border-radius:16px;border:0;background:var(--tile);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--lip);padding:12px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.hdr.red .icon-btn{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.icon-btn.gear{width:44px;height:44px;padding:11px;opacity:.7}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:22px;white-space:nowrap}
.brand .lg{width:42px;height:42px}
.ctx{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--tc);color:#fff;font-family:var(--fd);font-weight:600;font-size:18px;white-space:nowrap}
.ctx .an{width:36px;height:36px;background:#fff;border-radius:50%;padding:3px}
.spacer{flex:1}
.cancel-btn{border:0;background:transparent;color:var(--red);font-family:var(--fd);font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px}
.cancel-btn svg{width:20px;height:20px}
.tabs{flex:none;display:flex;gap:4px;background:var(--tile);padding:4px;border-radius:16px}
.hdr.red .tabs{background:rgba(255,255,255,.18)}
.tab{border:0;background:transparent;font-family:var(--fd);font-weight:600;font-size:16px;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:7px;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--lip)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 6px;font-family:var(--fd)}
.hdr.red .tab:not(.on) .badge{background:#fff;color:var(--red)}

.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:22px}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center}
.q{font-family:var(--fd);font-weight:700;font-size:clamp(30px,5.5vw,44px);line-height:1.05;margin:6px 0 22px;text-align:center}

/* buttons */
.btn{--lipc:rgba(0,0,0,.2);border:0;border-radius:20px;padding:14px 24px;font-family:var(--fd);font-weight:600;font-size:21px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 var(--lipc);transition:transform .08s,box-shadow .08s;min-height:62px;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lipc)}
.btn svg{width:24px;height:24px;flex:none}
.btn.primary{background:var(--red);color:#fff;--lipc:var(--red-d)}
.btn.ok{background:var(--green);color:#fff;--lipc:var(--green-d)}
.btn.mustard{background:var(--mustard);color:#3B1F12;--lipc:var(--mustard-d)}
.btn.ghost{background:var(--tile);color:var(--ink);--lipc:var(--lip)}
.btn.danger{background:var(--red);color:#fff;--lipc:var(--red-d)}
.btn.soft{opacity:.5}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.grow{flex:1}
.btn.sm{min-height:48px;font-size:17px;padding:10px 16px;border-radius:15px;box-shadow:0 4px 0 var(--lipc)}
.btn.sm svg{width:20px;height:20px}
.footbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-top:2px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--ink2);font-family:var(--fd);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* welcome */
.welcome{flex:1;background:var(--red);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:24px;text-align:center}
.float{position:absolute;width:clamp(70px,15vmin,130px);aspect-ratio:1;background:#FFF6EA;border-radius:50%;padding:clamp(10px,2.2vmin,18px);box-shadow:0 7px 0 rgba(0,0,0,.14);animation:bob 5s ease-in-out infinite;animation-delay:var(--d);transform:rotate(var(--r))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r) * -1))}}
.w-logo{width:clamp(150px,30vmin,230px);filter:drop-shadow(0 8px 0 rgba(0,0,0,.15));position:relative}
.w-title{font-family:var(--fd);font-weight:700;font-size:clamp(56px,13vw,120px);line-height:.95;margin:18px 0 6px;letter-spacing:-1px;position:relative;text-shadow:0 6px 0 var(--red-d)}
.w-sub{font-family:var(--fd);font-weight:500;font-size:clamp(18px,3.2vw,26px);margin:0 0 34px;opacity:.95;position:relative}
.w-cta{position:relative;display:flex;align-items:center;gap:12px;background:var(--mustard);color:#3B1F12;font-family:var(--fd);font-weight:600;font-size:clamp(20px,3.6vw,28px);padding:18px 30px;border-radius:999px;box-shadow:0 7px 0 var(--mustard-d);animation:pulse 1.8s ease-in-out infinite}
.w-cta svg{width:34px;height:34px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* mode + tables */
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;width:min(820px,100%);margin:0 auto}
.bigcard.dim{opacity:.45}
.tbl .due{background:#fff;color:#3B1F12;border-radius:999px;padding:2px 12px;font-size:16px;font-weight:600}
.bigcard{border:0;background:var(--surface);border-radius:32px;padding:24px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 8px 0 var(--lip);font-family:var(--fd);font-weight:700;font-size:30px}
.bigcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--lip)}
.bigcard .ill{width:min(220px,60%);aspect-ratio:1;background:var(--tile);border-radius:50%;padding:22px}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;width:min(820px,100%);margin:0 auto}
.tbl{border:0;background:var(--tc);color:#fff;border-radius:30px;padding:18px 12px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.18);font-family:var(--fd)}
.tbl:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tbl .an{width:96px;height:96px;background:#fff;border-radius:50%;padding:8px}
.tbl .nb{font-size:64px;font-weight:700;line-height:1}
.tbl .nm{font-size:18px;font-weight:500;opacity:.95}

/* menu */
.menu{flex:1;min-height:0;display:grid;grid-template-columns:124px 1fr}
.rail{overflow-y:auto;padding:12px 10px 24px;background:var(--surface);border-right:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cat{border:0;background:transparent;border-radius:22px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--fd);font-weight:600;font-size:15px;color:var(--ink2)}
.cat .ill{width:66px;height:66px;background:var(--tile);border-radius:50%;padding:8px}
.cat.on{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.cat.on .ill{background:#FFF6EA}
.gridwrap{overflow-y:auto;padding:18px 18px 30px}
.cat-title{font-family:var(--fd);font-weight:700;font-size:clamp(30px,5vw,40px);margin:2px 4px 16px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.pt{border:0;background:var(--surface);border-radius:28px;padding:12px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 var(--lip);text-align:center}
.pt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lip)}
.pt .ill{width:100%;aspect-ratio:1;background:var(--tile);border-radius:22px;padding:12px}
.pt .n{font-family:var(--fd);font-weight:600;font-size:19px;line-height:1.12}
.pt .s{font-size:13px;color:var(--ink2);line-height:1.3;font-weight:700}
.price{font-family:var(--fd);font-weight:700;font-size:19px;background:var(--mustard);color:#3B1F12;border-radius:999px;padding:3px 14px;white-space:nowrap}
.price.sm{font-size:15px;padding:2px 10px}
.price small{font-weight:500;font-size:.75em;margin-right:3px}
.say{border:0;background:var(--tile);color:var(--ink2);width:40px;height:40px;border-radius:50%;padding:9px;flex:none}
.say.sm{width:34px;height:34px;padding:8px}

/* cart bar */
.cbar{flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border-top:2px solid var(--line)}
.cbar .ci{position:relative;width:56px;height:56px;border-radius:18px;background:var(--tile);display:grid;place-items:center;padding:13px;flex:none}
.cbar .ci .badge{position:absolute;top:-7px;right:-7px}
.cbar .tt{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.cbar .tt span{font-size:14px;color:var(--ink2)}
.cbar .tt b{font-family:var(--fd);font-size:26px;font-weight:700}
.bump .ci{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95)}}

/* product */
.p-hero{display:flex;gap:22px;align-items:center;padding:22px 22px 8px}
.p-ill{width:min(38vw,230px);aspect-ratio:1;background:var(--tile);border-radius:34px;padding:18px;flex:none}
.p-name{font-family:var(--fd);font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0 0 8px}
.p-note{margin:0 0 12px;color:var(--ink2);font-size:16px}
.p-row{display:flex;align-items:center;gap:10px}
.sec{padding:10px 22px 12px}
.sec-label{font-family:var(--fd);font-weight:600;font-size:23px;margin:8px 0 12px;display:flex;align-items:center;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.opt{border:3px solid transparent;background:var(--surface);border-radius:24px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--lip);position:relative;font-family:var(--fd);font-weight:500;font-size:17px;line-height:1.1;text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lip)}
.opt .ill{width:76px;height:76px;transition:opacity .15s}
.opt.on{border-color:var(--red);background:var(--onsel)}
.opt .mk{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;padding:7px;box-shadow:0 3px 0 var(--red-d)}
.opt.removed{border-color:var(--line);border-style:dashed}
.opt.removed .ill{opacity:.28;filter:grayscale(1)}
.opt.removed .ol{color:var(--red)}
.opt .xx{position:absolute;top:12px;left:50%;width:70px;height:70px;margin-left:-35px;color:var(--red)}
.opt .dl{font-size:14px;font-weight:600;background:var(--mustard);color:#3B1F12;border-radius:999px;padding:1px 9px}
.hint{margin:10px 2px 0;color:var(--ink2);font-size:14px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:58px;height:58px;border-radius:18px;border:0;background:var(--tile);box-shadow:0 4px 0 var(--lip);padding:15px}
.stepper button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.stepper b{font-family:var(--fd);font-size:34px;min-width:36px;text-align:center}
.stepper.sm{gap:8px}.stepper.sm button{width:44px;height:44px;border-radius:14px;padding:11px}.stepper.sm b{font-size:24px;min-width:26px}

/* cart */
.lines{display:flex;flex-direction:column;gap:14px;width:min(820px,100%);margin:0 auto}
.line{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:26px;padding:14px;box-shadow:0 5px 0 var(--lip)}
.l-ill{width:88px;height:88px;background:var(--tile);border-radius:20px;padding:8px;flex:none}
.l-main{flex:1;min-width:0}
.l-name{font-family:var(--fd);font-weight:600;font-size:21px;line-height:1.1}
.l-ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.l-price{font-family:var(--fd);font-weight:700;font-size:22px;white-space:nowrap}
.mini{border:0;background:var(--tile);border-radius:14px;height:44px;min-width:44px;padding:10px 12px;display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--lip)}
.mini svg{width:20px;height:20px}
.mini.danger{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:13px;font-weight:800;padding:3px 9px;border-radius:9px;background:var(--tile);color:var(--ink2)}
.chip.sans{background:#FFE1DD;color:#B8261B}
.chip.plus{background:#FFF0C2;color:#7A4E00}
.empty-cart{text-align:center;color:var(--ink2);padding:40px 10px;font-size:18px}
.empty-cart .ill{width:140px;height:140px;margin:0 auto 10px;opacity:.6}
.upsell{width:min(820px,100%);margin:22px auto 8px;background:var(--mustard);border-radius:28px;padding:16px;color:#3B1F12}
.up-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.up-h b{font-family:var(--fd);font-weight:700;font-size:24px}
.up-h .linkbtn{color:#5A3A1A}
.up-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.up{border:0;background:#FFF6EA;color:#3B1F12;border-radius:20px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--fd);font-weight:600;font-size:15px;box-shadow:0 4px 0 var(--mustard-d)}
.up .ill{width:70px;height:70px}
.tot{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.tot span{font-size:14px;color:var(--ink2)}
.tot b{font-family:var(--fd);font-weight:700;font-size:30px}

/* pay */
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;width:min(760px,100%)}
.bigtotal{font-family:var(--fd);font-weight:700;font-size:clamp(48px,10vw,76px);line-height:1;margin:0 0 6px}
.bigtotal-l{color:var(--ink2);font-size:18px;margin:0 0 26px}
.cardart{width:200px;height:126px;border-radius:18px;background:linear-gradient(135deg,#1F6FEB,#6E3AFF);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18);transform:rotate(-6deg)}
.cardart::before{content:"";position:absolute;left:18px;top:34px;width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#FFE08A,#D9A93A)}
.cardart::after{content:"NyGio";position:absolute;left:18px;bottom:14px;color:#fff;font-family:var(--fd);font-weight:600;font-size:18px}
.cashart{display:flex;align-items:center;gap:6px}
.cashart .b{width:130px}.cashart .c{width:62px}
.tpe-zone{position:relative;width:330px;height:300px;margin:0 auto 10px;max-width:100%}
.tpe{position:absolute;left:14px;top:14px;width:176px;height:272px;background:#2B2B33;border-radius:28px;padding:14px;box-shadow:0 8px 0 #15151a}
.tpe-scr{background:#D4EBD6;color:#1C3A22;border-radius:14px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--fd);font-weight:600;font-size:17px;text-align:center;padding:6px}
.tpe-scr b{font-size:26px}
.tpe-scr small{font-size:13px;font-weight:500}
.tpe-scr .dots{letter-spacing:4px}
.tpe-scr.ok{background:#2F9E44;color:#fff}
.tpe-scr .okt{display:flex;align-items:center;gap:6px;font-size:22px}
.tpe-scr .okt svg{width:26px;height:26px}
.tpe-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.tpe-keys i{height:20px;border-radius:7px;background:#484856}
.tpe-keys i:nth-child(10){background:#D9534F}.tpe-keys i:nth-child(12){background:#3FA34D}
.cb{position:absolute;right:0;top:36px;width:170px;height:108px;border:0;border-radius:16px;background:linear-gradient(135deg,#1F6FEB,#6E3AFF);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);transform:rotate(8deg);transition:transform .7s cubic-bezier(.2,.9,.3,1.15);padding:14px;text-align:left;font-family:var(--fd)}
.cb.pulse{animation:cardp 1.4s ease-in-out infinite}
@keyframes cardp{0%,100%{transform:rotate(8deg)}50%{transform:rotate(8deg) translateY(-8px)}}
.cb.in{transform:translate(-128px,150px) rotate(-3deg) scale(.86)}
.cb .chipc{display:block;width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#FFE08A,#D9A93A);margin-top:14px}
.cb .cbn{position:absolute;left:14px;bottom:12px;font-weight:600;font-size:17px}
.cb .cbnum{position:absolute;right:14px;bottom:13px;font-size:13px;opacity:.85}
.cb .wv{position:absolute;right:12px;top:12px;width:26px;height:26px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;margin-top:8px}
.key{width:76px;height:70px;border:0;border-radius:20px;background:var(--surface);box-shadow:0 5px 0 var(--lip);font-family:var(--fd);font-weight:600;font-size:30px;display:grid;place-items:center}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lip)}
.key svg{width:30px;height:30px}
.cash-top{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(820px,100%);margin:0 auto 16px}
.ct{background:var(--surface);border-radius:22px;padding:12px;text-align:center;box-shadow:0 5px 0 var(--lip)}
.ct span{display:block;font-size:14px;color:var(--ink2)}
.ct b{font-family:var(--fd);font-weight:700;font-size:clamp(22px,4vw,32px)}
.ct.miss b{color:var(--red)}
.ct.good{background:var(--green);color:#fff}.ct.good span{color:#E7F7EA}
.tray{width:min(820px,100%);margin:0 auto 10px;min-height:80px;background:var(--tile);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}

.mm.coin{width:48px;height:48px}.mm.bill{width:84px;height:48px}
.money{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:min(820px,100%);margin:0 auto}
.mbtn{border:0;background:transparent;padding:0;border-radius:14px;filter:drop-shadow(0 5px 0 var(--lip))}
.mbtn:active{transform:translateY(4px)}
.mbtn.coin{width:96px;height:96px;border-radius:50%}
.mbtn.bill{width:164px;height:92px}
.change-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0 26px}
.change-row .coin{width:78px;height:78px}.change-row .bill{width:140px;height:79px}
.pop{animation:popin .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ticket */
.tk-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:22px 16px 40px;gap:18px}
.slot{width:min(430px,94%);height:20px;background:#3B1F12;border-radius:10px;position:relative;z-index:2;box-shadow:inset 0 -6px 0 #1f0f08}
.tk-clip{width:min(380px,86%);overflow:hidden;margin-top:-28px;padding-top:10px}
.ticket{background:#FFFFFF;color:#2B2B2B;font-family:'Courier New',ui-monospace,monospace;font-weight:700;padding:22px 20px 30px;animation:printk 2s steps(20) both;font-size:15px;position:relative;
  -webkit-mask:radial-gradient(8px at 50% 100%,#0000 98%,#000) 50% 100%/16px 100% repeat-x;mask:radial-gradient(8px at 50% 100%,#0000 98%,#000) 50% 100%/16px 100% repeat-x}
@keyframes printk{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.tk-c{text-align:center}
.tk-logo{width:64px;height:64px;margin:0 auto 6px}
.tk-name{font-family:var(--fd);font-size:26px;font-weight:700}
.tk-hr{border:0;border-top:2px dashed #BBB;margin:12px 0}
.tk-num{font-family:var(--fd);font-size:18px;margin:4px 0}
.tk-num b{display:block;font-size:64px;line-height:1}
.tk-where{display:inline-flex;align-items:center;gap:8px;background:var(--tc);color:#fff;border-radius:999px;padding:4px 14px 4px 4px;font-family:var(--fd);font-size:18px;margin-top:6px}
.tk-where .an{width:32px;height:32px;background:#fff;border-radius:50%;padding:3px}
.tk-l{display:flex;justify-content:space-between;gap:10px;margin:6px 0 0}
.tk-d{color:#777;font-size:13px;margin:0 0 4px 22px}
.tk-tot{display:flex;justify-content:space-between;font-size:22px;margin-top:4px}
.tk-thanks{font-family:var(--fd);font-size:22px;margin-top:12px}

/* kitchen */
.kitchen{padding:16px 16px 30px}
.k-head{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.k-stat{background:var(--surface);border-radius:18px;padding:10px 16px;font-family:var(--fd);font-weight:500;font-size:18px;box-shadow:0 4px 0 var(--lip);display:flex;align-items:center;gap:8px}
.k-stat b{font-size:30px;font-weight:700}
.k-stat.ready b{color:var(--green)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.k-table{background:var(--surface);border-radius:26px;box-shadow:0 5px 0 var(--lip);overflow:hidden;border-top:10px solid var(--tc)}
.k-table>header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.k-an{width:50px;height:50px;border-radius:50%;background:var(--tile);padding:4px;flex:none}
.k-tname{font-family:var(--fd);font-weight:700;font-size:24px;line-height:1}
.k-tsub{font-size:14px;color:var(--ink2)}
.k-table.empty{opacity:.55}
.k-table.empty>header{padding-bottom:14px}
.k-order{margin:0 12px 12px;border-radius:20px;background:var(--tile);padding:12px}
.k-order.ready{background:var(--readybg);box-shadow:0 0 0 3px var(--green);animation:rdy 1.8s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 0 0 6px rgba(47,158,68,.45)}}
.k-otop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.k-num{font-family:var(--fd);font-weight:700;font-size:24px}
.k-time{color:var(--ink2);font-size:14px}
.k-st{margin-left:auto;font-family:var(--fd);font-weight:600;font-size:14px;padding:4px 11px;border-radius:999px;background:var(--mustard);color:#3B1F12}
.k-st.ready{background:var(--green);color:#fff}
.k-lines{list-style:none;margin:10px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.k-lines li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:9px;cursor:pointer}
.k-ck{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;padding:5px;margin-top:6px}
.k-lines li.done .k-ck{background:var(--green);border-color:var(--green)}
.k-lines li.done .k-body{opacity:.45}
.k-lines li.done .k-ln{text-decoration:line-through}
.k-ill{width:56px;height:56px;flex:none;background:var(--tile);border-radius:14px;padding:4px}
.k-body{flex:1;min-width:0}
.k-ln{font-family:var(--fd);font-weight:600;font-size:19px;line-height:1.15}
.k-ln b{color:var(--red);margin-right:4px}
.k-th{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.k-th span{width:34px;height:34px;background:var(--tile);border-radius:10px;padding:2px}
.k-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.k-empty{padding:0 16px 16px;color:var(--ink2);font-size:15px}
.k-none{text-align:center;color:var(--ink2);padding:10px 0 20px;font-size:17px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(40,20,10,.55);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}

.dlg{background:var(--surface);border-radius:30px;padding:26px 24px;width:min(460px,100%);box-shadow:0 10px 0 var(--lip);text-align:center;animation:popin .3s cubic-bezier(.2,.9,.3,1.2)}
.dlg h3{font-family:var(--fd);font-weight:700;font-size:28px;margin:4px 0 8px}
.dlg p{color:var(--ink2);font-size:17px;margin:0 0 20px}
.dlg-b{display:flex;gap:12px}
.dlg-b .btn{flex:1}
.idle-ill{width:120px;height:120px;margin:0 auto}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}
.pin-dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink2)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.shake{animation:shake .4s}

.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--surface);border-bottom:2px solid var(--line)}
.sheet-h h3{font-family:var(--fd);font-weight:700;font-size:26px;margin:0}
.sheet-b{flex:1;overflow-y:auto;padding:8px 18px 30px}
.sheet-b h4{font-family:var(--fd);font-weight:700;font-size:22px;margin:22px 0 10px}
.sheet-b h5{font-family:var(--fd);font-weight:600;font-size:18px;margin:16px 0 8px;color:var(--ink2)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.sw{border:0;width:64px;height:36px;border-radius:18px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sw.on{background:var(--green)}.sw.on::after{left:32px}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:8px 10px;margin-bottom:6px}
.prow.off .pi,.prow.off .pn{opacity:.4}
.prow .pi{width:40px;height:40px;flex:none}
.prow .pn{flex:1;min-width:0;font-size:15px}
.pstep{display:flex;align-items:center;gap:6px}
.pstep button{width:38px;height:38px;border:0;border-radius:12px;background:var(--tile);font-family:var(--fd);font-size:22px;font-weight:600}
.pstep b{font-family:var(--fd);min-width:64px;text-align:center;font-size:17px}
.pinrow{display:flex;gap:10px}
.pinrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:20px;background:var(--surface);color:var(--ink);letter-spacing:6px}
.resets{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#3B1F12;color:#fff;font-family:var(--fd);font-weight:600;font-size:19px;padding:12px 22px;border-radius:999px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
.toast svg{width:22px;height:22px;color:#7BD389}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:920px){.brand .bn,.cancel-btn span{display:none}}
@media (max-width:640px){
 .brand .bn,.tab span:not(.badge),.cancel-btn span{display:none}

 .ctx{font-size:15px;padding:4px 10px 4px 4px}.ctx .an{width:30px;height:30px}
 .icon-btn{width:44px;height:44px;padding:10px}.icon-btn.gear{width:38px;height:38px;padding:9px}
 .tab{padding:8px 10px}
 .cancel-btn{padding:6px}
 .pt .s{display:none}
 .cbar{gap:10px;padding:10px 12px}.cbar .ci{width:48px;height:48px;padding:11px}

 .footbar{gap:8px;padding:10px 12px}.footbar .btn{font-size:18px;padding:12px 14px}
 .menu{grid-template-columns:96px 1fr}
 .cat .ill{width:54px;height:54px;padding:6px}
 .cat{font-size:13px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .pt .n{font-size:16px}
 .p-hero{flex-direction:column;text-align:center}
 .p-row{justify-content:center}
 .opts{grid-template-columns:repeat(3,1fr);gap:10px}

 .opt{font-size:15px}
 .k-grid{grid-template-columns:1fr}
 .cash-top{grid-template-columns:1fr 1fr 1fr;gap:8px}
 .mbtn.coin{width:78px;height:78px}.mbtn.bill{width:136px;height:76px}
 .l-ill{width:66px;height:66px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function tone(f,d,w,type,v){const a=ac();if(!a)return;const t=a.currentTime+(w||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={tap:()=>tone(720,.07,0,'sine',.07),key:()=>tone(1000,.06,0,'square',.04),add:()=>{tone(660,.09,0,'sine',.12);tone(990,.16,.09,'sine',.12)},bip:()=>tone(1400,.12,0,'square',.05),ok:()=>{tone(1400,.1,0,'square',.06);tone(1400,.1,.16,'square',.06);tone(1870,.28,.32,'sine',.1)},coin:()=>{tone(1800,.05,0,'triangle',.08);tone(2400,.14,.05,'triangle',.07)},err:()=>tone(200,.22,0,'sawtooth',.05),ding:()=>{tone(1047,.6,0,'sine',.16);tone(784,.8,.38,'sine',.16)},print:()=>{for(let i=0;i<14;i++)tone(i%2?340:300,.05,i*.1,'square',.025)}};

function vMode(){return `<div class="scroll pad"><h2 class="q">Tu manges où ?</h2><div class="big2"><button class="bigcard" data-act="mode" data-v="place"><span class="ill">${ill('place')}</span>Sur place</button><button class="bigcard" data-act="mode" data-v="emporter"><span class="ill">${ill('bag')}</span>À emporter</button><button class="bigcard" data-act="mode" data-v="addition"><span class="ill">${ill('addition')}</span>Payer l’addition</button></div></div>`}

function vTable(){return `<div class="scroll pad"><h2 class="q">À quelle table ?</h2><div class="tables">${['1','2','3','4','5'].map(t=>`<button class="tbl" style="--tc:${TABLES[t].c}" data-act="table" data-v="${t}"><span class="an">${animal(t)}</span><span class="nb">${t}</span>${billTotal(t)?`<span class="due">Addition ${fmt(billTotal(t))}</span>`:`<span class="nm">Table ${t}</span>`}</button>`).join('')}</div></div>`}

function vBill(){const t=S.bill;const os=openOrders(t);const lines=[].concat(...os.map(o=>o.lines));
 const rows=lines.map(l=>`<div class="line"><div class="l-ill">${ill(l.ill)}</div><div class="l-main"><div class="l-name">${l.qty>1?l.qty+'× ':''}${esc(l.name)}</div>${chipsHtml(l.det)}</div><div class="l-price">${fmt(l.unit*l.qty)}</div></div>`).join('');
 const waiting=os.filter(o=>o.status!=='served').length;
 return `<div class="scroll pad" data-keep="bill"><h2 class="q">L’addition</h2>${waiting?`<p class="hint" style="text-align:center;margin:-10px 0 16px">${waiting>1?waiting+' commandes ne sont pas encore servies':'1 commande n’est pas encore servie'}</p>`:''}<div class="lines">${rows||'<div class="empty-cart">Rien à payer pour cette table.</div>'}</div></div>

 return `<div class="menu"><nav class="rail" data-keep="rail">${CATS.map(c=>`<button class="cat ${c.id===S.cat?'on':''}" data-act="cat" data-v="${c.id}"><span class="ill">${ill(c.ill)}</span><span>${c.name}</span></button>`).join('')}</nav>
 <div class="gridwrap" data-keep="grid-${S.cat}"><h2 class="cat-title">${cat.name}</h2><div class="grid">${items.length?items.map(it=>`<button class="pt" data-act="prod" data-v="${it.id}"><span class="ill">${ill(it.ill)}</span><span class="n">${esc(it.name)}</span>${it.cat==='formules'&&it.note?`<span class="s">${esc(it.note)}</span>`:''}<span class="price">${it.from?'<small>dès</small>':''}${fmt(tileFrom(it))}</span></button>`).join(''):'<p class="k-none">Rien dans cette catégorie pour le moment.</p>'}</div></div></div>${cartBar()}`}

function cartBar(){const n=cartCount();
 return `<div class="cbar ${S.bump?'bump':''}"><div class="ci">${IC.cart}${n?`<span class="badge">${n}</span>`:''}</div><div class="tt"><span>${n?(n>1?n+' articles':'1 article'):'Ta commande est vide'}</span><b>${fmt(cartTotal())}</b></div><button class="btn primary" data-act="cart" ${n?'':'disabled'}>Voir ma commande</button></div>`}

function vProduct(){
 const it=ITEM[S.prod];const unit=unitPrice(it,S.sel);const k=itemIll(it,S.sel);
 const secs=visSections(it,S.sel).map(s=>{const v=S.sel[s.k];const cs=visChoices(s);
  return `<section class="sec"><h3 class="sec-label">${s.label}<button class="say sm" data-act="say" data-v="${esc(s.label)}" aria-label="Écouter">${IC.speaker}</button></h3><div class="opts">${cs.map(c=>{let cls='',mk='';
   if(s.type==='choice'){if(v===c.id){cls='on';mk=`<span class="mk">${IC.check}</span>`}}
   else if(s.type==='remove'){if(v.includes(c.id)){cls='removed';mk=`<span class="xx">${IC.xBig}</span>`}}
   else if(v.includes(c.id)){cls='on';mk=`<span class="mk">${IC.check}</span>`}
   const d=dOf(c);const lab=s.type==='remove'&&v.includes(c.id)?'Sans '+c.label.toLowerCase():c.label;
   return `<button class="opt ${cls}" data-act="opt" data-k="${s.k}" data-v="${c.id}"><span class="ill">${iconSvg(c.icon)}</span><span class="ol">${esc(lab)}</span>${d?`<span class="dl">+${fmt(d)}</span>`:''}${mk}</button>`}).join('')}</div>${s.type==='remove'?'<p class="hint">Touche un ingrédient pour l’enlever. Touche encore pour le remettre.</p>':''}</section>`}).join('');
 return `<div class="scroll" data-keep="prod-${it.id}"><div class="p-hero"><div class="p-ill">${ill(k)}</div><div><h1 class="p-name">${esc(it.name)}</h1>${it.note?`<p class="p-note">${esc(it.note)}</p>`:''}<div class="p-row"><span class="price">${fmt(unit)}</span><button class="say" data-act="say" data-v="${esc(it.name+', '+say$(unit))}" aria-label="Écouter">${IC.speaker}</button></div></div></div>${secs}
 <section class="sec"><h3 class="sec-label">Combien ?</h3><div class="stepper"><button data-act="qty" data-v="-1" aria-label="Moins">${IC.minus}</button><b>${S.qty}</b><button data-act="qty" data-v="1" aria-label="Plus">${IC.plus}</button></div></section><div style="height:20px"></div></div>
 <div class="footbar"><button class="btn ghost" data-act="back">${IC.back}Retour</button><button class="btn primary grow" data-act="add">${S.editUid?IC.check+'Modifier':IC.plus+'Ajouter'} · ${fmt(unit*S.qty)}</button></div>`}

function vCart(){
 const lines=S.cart.map(l=>`<div class="line"><div class="l-ill">${ill(l.ill)}</div><div class="l-main"><div class="l-name">${esc(l.name)}</div>${chipsHtml(l.det)}<div class="l-ctrl"><div class="stepper sm"><button data-act="lqty" data-u="${l.uid}" data-v="-1" aria-label="Moins">${IC.minus}</button><b>${l.qty}</b><button data-act="lqty" data-u="${l.uid}" data-v="1" aria-label="Plus">${IC.plus}</button></div>${ITEM[l.id].sec.length?`<button class="mini" data-act="ledit" data-u="${l.uid}">${IC.edit}Changer</button>`:''}<button class="mini danger" data-act="ldel" data-u="${l.uid}" aria-label="Supprimer">${IC.trash}</button></div></div><div class="l-price">${fmt(l.unit*l.qty)}</div></div>`).join('');
 const hasDessert=S.cart.some(l=>l.cat==='desserts'||l.id==='nygio'||l.id==='brasserie');
 const ups=['glace','donut','cookie','crepe'].filter(i=>visible(ITEM[i]));
 const upsell=(!S.upsellOff&&S.cart.length&&!hasDessert&&ups.length)?`<div class="upsell"><div class="up-h"><b>Un dessert avec ça ?</b><button class="linkbtn" data-act="upsellOff">Non merci</button></div><div class="up-row">${ups.map(i=>`<button class="up" data-act="prod" data-v="${i}" data-from="cart"><span class="ill">${ill(ITEM[i].ill)}</span><span>${ITEM[i].name}</span><span class="price sm">${fmt(priceOf(ITEM[i]))}</span></button>`).join('')}</div></div>`:'';
 return `<div class="scroll pad" data-keep="cart"><h2 class="q">Ma commande</h2>${S.cart.length?`<div class="lines">${lines}</div>`:`<div class="empty-cart"><div class="ill">${ill('burger')}</div>Ta commande est vide. Ajoute quelque chose à manger !</div>`}${upsell}</div>
 <div class="footbar"><div class="tot"><span>Total</span><b>${fmt(cartTotal())}</b></div><button class="btn ghost" data-act="back">${IC.plus}Ajouter</button>${S.mode==='place'?`<button class="btn ok" data-act="send" ${S.cart.length?'':'disabled'}>${IC.chef}Envoyer en cuisine</button>`:`<button class="btn primary" data-act="topay" ${S.cart.length?'':'disabled'}>Payer</button>`}</div>`}

function vPayChoose(){return `<div class="scroll pad center-col"><p class="bigtotal-l">À payer</p><div class="bigtotal">${fmt(payTotal())}</div><h2 class="q" style="margin-top:20px">Comment tu paies ?</h2><div class="paygrid"><button class="bigcard" data-act="paycard"><span style="padding:30px 0 22px"><span class="cardart" style="display:block"></span></span>Carte</button><button class="bigcard" data-act="paycash"><span class="cashart" style="padding:30px 0 22px"><span class="b">${MONEY(1000)}</span><span class="c">${MONEY(200)}</span></span>Espèces</button></div></div>`}

function vCard(){const p=S.pay,t=payTotal();
 const scr={insert:`<small>Montant</small><b>${fmt(t)}</b><span>Pose ta carte</span>`,tapping:`<b>${fmt(t)}</b><span>Lecture…</span>`,pin:`<small>Code secret</small><b class="dots">${[0,1,2,3].map(i=>i<p.pin.length?'●':'○').join('')}</b>`,proc:'<span>Paiement en cours…</span>',ok:`<span class="okt">${IC.check}Accepté</span>`}[p.step];
 const title={insert:'Pose ta carte sur le terminal',tapping:'Pose ta carte sur le terminal',pin:'Tape ton code secret',proc:'Patiente un peu…',ok:'Paiement accepté !'}[p.step];

 ${p.step==='pin'?`<div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button class="key" data-act="cpk" data-v="${k}" aria-label="${k==='del'?'Effacer':k}">${k==='del'?IC.backspace:k}</button>`).join('')}</div>`:''}</div>`}

function vCash(){const p=S.pay,t=payTotal(),rest=t-p.given;
 return `<div class="scroll pad" data-keep="cash"><div class="cash-top"><div class="ct"><span>À payer</span><b>${fmt(t)}</b></div><div class="ct"><span>Tu as donné</span><b>${fmt(p.given)}</b></div><div class="ct ${rest>0?'miss':'good'}"><span>${rest>0?'Il manque':'À rendre'}</span><b>${fmt(Math.abs(rest))}</b></div></div>
 <div class="tray">${p.pieces.length?p.pieces.map(v=>`<span class="mm ${v>=500?'bill':'coin'} pop">${MONEY(v)}</span>`).join(''):'<span class="empty">Touche les pièces et les billets que tu donnes</span>'}</div>
 <h3 class="sec-label">Les pièces</h3><div class="money">${[50,100,200].map(v=>`<button class="mbtn coin" data-act="money" data-v="${v}" aria-label="${say$(v)}">${MONEY(v)}</button>`).join('')}</div>
 <h3 class="sec-label">Les billets</h3><div class="money">${[500,1000,2000,5000].map(v=>`<button class="mbtn bill" data-act="money" data-v="${v}" aria-label="${say$(v)}">${MONEY(v)}</button>`).join('')}</div><div style="height:16px"></div></div>
 <div class="footbar"><button class="btn ghost" data-act="mclear" ${p.given?'':'disabled'}>Reprendre</button><button class="btn ok grow ${rest>0?'soft':''}" data-act="cashok">${IC.check}Valider</button></div>`}

function changeOf(a){const r=[];[5000,2000,1000,500,200,100,50,20,10,5,2,1].forEach(d=>{while(a>=d){r.push(d);a-=d}});return r}
function vChange(){const c=S.pay.change;
 return `<div class="scroll pad center-col"><h2 class="q">${c?'Je te rends la monnaie':'Compte juste, merci !'}</h2>${c?`<div class="bigtotal">${fmt(c)}</div><div class="change-row">${changeOf(c).filter(v=>v>=50).map((v,i)=>`<span class="${v>=500?'bill':'coin'} pop" style="animation-delay:${i*.15}s">${MONEY(v)}</span>`).join('')}</div>`:`<div style="width:160px;height:160px;margin:10px auto 26px">${ill('donut')}</div>`}<button class="btn primary" data-act="finish">Prendre mon ticket</button></div>`}

function vTicket(){const o=S.last;if(!o)return '';const d=new Date(o.t);
 const lines=o.lines.map(l=>`<div class="tk-l"><span>${l.qty}× ${esc(l.name)}</span><span>${fmt(l.unit*l.qty)}</span></div>${l.det.length?`<div class="tk-d">${l.det.map(x=>esc(x.t)).join(' · ')}</div>`:''}`).join('');
 const title=o.kind==='bill'?'<div class="tk-num">Addition<b style="font-size:40px">Table '+o.table+'</b></div>':`<div class="tk-num">${o.kind==='sent'?'Bon de commande':'Commande'} n°<b>${o.num}</b></div>`;
 const payLine=o.kind==='sent'?'<div class="tk-c">À payer à la fin du repas</div>':`<div>Payé ${o.pay==='carte'?'par carte':'en espèces'}</div>${o.pay==='especes'?`<div>Donné : ${fmt(o.given)} · Rendu : ${fmt(o.change)}</div>`:''}`;
 const thanks=o.kind==='sent'?'C’est parti en cuisine !':o.kind==='bill'?'Merci et à bientôt !':'Merci et bon appétit !';
 return `<div class="tk-wrap"><div class="slot"></div><div class="tk-clip"><div class="ticket"><div class="tk-c"><div class="tk-logo">${LOGO}</div><div class="tk-name">Chez NyGio</div><div>${d.toLocaleDateString('fr-FR')} ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div><hr class="tk-hr">${title}<div class="tk-where" style="--tc:${TABLES[o.table].c}"><span class="an">${animal(o.table)}</span>${tLabel(o.table)}</div></div><hr class="tk-hr">${lines}<hr class="tk-hr"><div class="tk-tot"><span>TOTAL</span><span>${fmt(o.total)}</span></div>${payLine}<hr class="tk-hr"><div class="tk-c tk-thanks">${thanks}</div></div></div><button class="btn primary" data-act="newOrder">${o.kind==='sent'?'Terminé':'Nouvelle commande'}</button></div>`}

function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?'à l’instant':m<60?`il y a ${m} min`:`il y a ${Math.floor(m/60)} h`}
function vKitchen(){
 const prep=orders.filter(o=>o.status==='prep').length,ready=orders.filter(o=>o.status==='ready').length;
 const groups=['1','2','3','4','5','E'].map(t=>{const os=orders.filter(o=>o.table===t&&o.status!=='served').sort((a,b)=>a.t-b.t);const due=billTotal(t);const busy=os.length||due;
  const head=`<header><span class="k-an">${animal(t)}</span><div><div class="k-tname">${tLabel(t)}</div><div class="k-tsub">${os.length?(os.length>1?os.length+' en cours':'1 en cours'):(t==='E'?'Aucune commande':due?'Tout est servi':'Table libre')}${due&&t!=='E'?` · addition ${fmt(due)}`:''}</div></div><div class="spacer"></div>${busy&&t!=='E'?`<button class="mini" data-act="free" data-v="${t}">Libérer</button>`:''}</header>`;
  if(!os.length)return `<section class="k-table ${due?'':'empty'}" style="--tc:${TABLES[t].c}">${head}</section>`;
  return `<section class="k-table" style="--tc:${TABLES[t].c}">${head}${os.map(o=>`<article class="k-order ${o.status}"><div class="k-otop"><span class="k-num">N° ${o.num}</span><span class="k-time">${new Date(o.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} · ${ago(o.t)}</span><span class="k-st ${o.status}">${o.status==='ready'?'Prête':'En préparation'}</span></div>
  <ul class="k-lines">${o.lines.map((l,i)=>`<li class="${l.done?'done':''}" data-act="kline" data-o="${o.id}" data-i="${i}"><span class="k-ck">${l.done?IC.check:''}</span><span class="k-ill">${ill(l.ill)}</span><div class="k-body"><div class="k-ln"><b>${l.qty}×</b>${esc(l.name)}</div>${chipsHtml(l.det)}${l.th&&l.th.length?`<div class="k-th">${l.th.map(k=>`<span>${ill(k)}</span>`).join('')}</div>`:''}</div></li>`).join('')}</ul>
  <div class="k-act">${o.status==='prep'?`<button class="btn ok sm" data-act="ready" data-v="${o.id}">${IC.bell}C’est prêt</button>`:`<button class="btn ok sm" data-act="served" data-v="${o.id}">${IC.check}Servie</button><button class="mini" data-act="recall" data-v="${o.id}">${IC.speaker}Rappeler</button>`}<div class="spacer"></div><button class="mini danger" data-act="kcancel" data-v="${o.id}">${IC.x}Annuler</button></div></article>`).join('')}</section>`}).join('');
 return `<div class="scroll kitchen" data-keep="kitchen"><div class="k-head"><div class="k-stat"><b>${prep}</b>en préparation</div><div class="k-stat ready"><b>${ready}</b>${ready>1?'prêtes':'prête'}</div></div>${orders.length?'':'<p class="k-none">Aucune commande pour le moment. Les commandes passées sur la borne arrivent ici.</p>'}<div class="k-grid">${groups}</div></div>`}

function vModal(){const m=S.modal;if(!m)return '';

 if(m.type==='idle')return `<div class="ov"><div class="dlg"><div class="idle-ill">${ill('glace')}</div><h3>Tu es toujours là ?</h3><p>La commande s’annule dans ${m.count} secondes.</p><button class="btn primary" style="width:100%" data-act="mclose">Oui, je suis là !</button></div></div>`;
 if(m.type==='pin')return `<div class="ov"><div class="dlg ${m.err?'shake':''}"><h3>Espace parent</h3><p>Tape le code à 4 chiffres</p><div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<m.v.length?'f':''}"></i>`).join('')}</div><div class="keypad" style="margin-bottom:18px">${['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button class="key" data-act="pk" data-v="${k}" aria-label="${k==='del'?'Effacer':k}">${k==='del'?IC.backspace:k}</button>`).join('')}</div><button class="btn ghost" style="width:100%" data-act="mclose">Fermer</button></div></div>`;
 if(m.type==='parent'){
  const row=(k,l)=>`<div class="setrow"><span>${l}</span><button class="sw ${settings[k]?'on':''}" data-act="pset" data-k="${k}" aria-label="${l}"></button></div>`;
  const cats=CATS.map(c=>`<h5>${c.name}</h5>${ITEMS.filter(i=>i.cat===c.id).map(i=>`<div class="prow ${visible(i)?'':'off'}"><span class="pi">${ill(i.ill)}</span><span class="pn">${esc(i.name)}${i.from?' <small>(supplément)</small>':''}</span><div class="pstep"><button data-act="pprice" data-id="${i.id}" data-d="-50" aria-label="Baisser">−</button><b>${fmt(priceOf(i))}</b><button data-act="pprice" data-id="${i.id}" data-d="50" aria-label="Augmenter">+</button></div><button class="sw ${visible(i)?'on':''}" data-act="phide" data-id="${i.id}" aria-label="Visible"></button></div>`).join('')}`).join('');
  return `<div class="ov"><div class="sheet"><div class="sheet-h"><h3>Espace parent</h3><button class="icon-btn" data-act="mclose" aria-label="Fermer">${IC.x}</button></div><div class="sheet-b" data-keep="parent">
  <h4>Réglages</h4>${row('voice','La voix lit les plats')}${row('sound','Les sons de la borne')}${row('idle','Retour à l’accueil si personne ne touche la borne')}
  <h4>Code parent</h4><div class="pinrow"><input id="newpin" type="password" inputmode="numeric" maxlength="4" placeholder="Nouveau code" autocomplete="off"><button class="btn ok sm" data-act="savepin">Enregistrer</button></div>
  <h4>La carte et les prix</h4><p class="hint" style="margin-top:0">L’interrupteur vert affiche le plat sur la borne. Éteins-le si le jouet n’est pas dans les boîtes.</p>${cats}
  <h4>Remise à zéro</h4><div class="resets"><button class="btn ghost sm" data-act="resetPrices">Remettre les prix d’origine</button><button class="btn ghost sm" data-act="clearOrders">Effacer toutes les commandes en cuisine</button><button class="btn ghost sm" data-act="resetNum">Recommencer les numéros à 1</button></div></div></div></div>`}
 return ''}

function vScreen(){switch(S.screen){case 'welcome':return vWelcome();case 'mode':return vMode();case 'table':return vTable();case 'menu':return vMenu();case 'product':return vProduct();case 'cart':return vCart();case 'paychoose':return vPayChoose();case 'card':return vCard();case 'cash':return vCash();case 'change':return vChange();case 'ticket':return vTicket();case 'billtable':return vBillTable();case 'bill':return vBill()}return ''}

function render(){
 const keep={};$app.querySelectorAll('[data-keep]').forEach(e=>keep[e.dataset.keep]=e.scrollTop);
 $app.innerHTML=header()+`<main class="main">${S.tab==='kitchen'?vKitchen():vScreen()}</main>`+vModal()+`<div class="toast ${S.toast?'show':''}" role="status">${IC.check}<span>${esc(S.toast||'')}</span></div>`;
 $app.querySelectorAll('[data-keep]').forEach(e=>{if(keep[e.dataset.keep]!=null)e.scrollTop=keep[e.dataset.keep]});
}

/* ---------- actions ---------- */
function openProduct(id,from,editUid){const it=ITEM[id];S.prod=id;S.prodFrom=from||'menu';S.editUid=editUid||null;
 if(editUid){const l=S.cart.find(l=>l.uid===editUid);S.sel=JSON.parse(JSON.stringify(l.sel));S.qty=l.qty}else{S.sel=defaults(it);S.qty=1}
 sfx('tap');go('product');say(it.name+', '+say$(unitPrice(it,S.sel)))}
function addToCart(){const it=ITEM[S.prod];const unit=unitPrice(it,S.sel);const {d,th}=describe(it,S.sel);
 const line={uid:S.editUid||uid(),id:it.id,name:it.name,cat:it.cat,ill:itemIll(it,S.sel),qty:S.qty,unit,sel:JSON.parse(JSON.stringify(S.sel)),det:d,th};
 sfx('add');
 if(S.editUid){const i=S.cart.findIndex(l=>l.uid===S.editUid);if(i>=0)S.cart[i]=line;S.editUid=null;say('C’est modifié');go('cart');return}
 S.cart.push(line);say(it.name+', c’est ajouté !');S.bump=true;
 if(S.prodFrom==='cart'){go('cart')}else{go('menu')}
 toast('Ajouté à ta commande');setTimeout(()=>{S.bump=false},500)}
function sendKitchen(){if(!S.cart.length||S.screen==='ticket')return;counter++;
 const o={id:uid(),num:counter,table:String(S.table),lines:S.cart.map(l=>Object.assign({},l,{done:false})),total:cartTotal(),pay:null,paid:false,status:'prep',t:Date.now()};
 orders.push(o);saveAll();S.last=Object.assign({kind:'sent'},o);sfx('print');go('ticket');say('C’est parti en cuisine ! Tu paieras à la fin du repas.');
 clearTimeout(ticketT);ticketT=setTimeout(()=>{if(S.screen==='ticket')resetOrder()},30000)}
function finalize(){if(S.screen==='ticket')return;
 if(S.bill){const t=S.bill;const os=openOrders(t);const lines=[].concat(...os.map(o=>o.lines));const total=billTotal(t);
  os.forEach(o=>{o.paid=true;o.pay=S.pay.method});orders=orders.filter(o=>!(o.paid&&o.status==='served'));saveAll();
  S.last={kind:'bill',table:t,lines,total,pay:S.pay.method,given:S.pay.given||0,change:S.pay.change||0,t:Date.now()};
  sfx('print');go('ticket');say('Merci ! L’addition de la table '+t+' est réglée. À bientôt !');
  clearTimeout(ticketT);ticketT=setTimeout(()=>{if(S.screen==='ticket')resetOrder()},30000);return}
 counter++;
 const o={id:uid(),num:counter,table:S.mode==='place'?String(S.table):'E',lines:S.cart.map(l=>Object.assign({},l,{done:false})),total:cartTotal(),pay:S.pay.method,paid:true,given:S.pay.given||0,change:S.pay.change||0,status:'prep',t:Date.now()};
 orders.push(o);saveAll();S.last=Object.assign({kind:'order'},o);sfx('print');go('ticket');say('Merci ! Ta commande numéro '+o.num+' part en cuisine.');
 clearTimeout(ticketT);ticketT=setTimeout(()=>{if(S.screen==='ticket')resetOrder()},30000)}
const findO=id=>orders.find(o=>o.id===id);
function announce(o){sfx('ding');setTimeout(()=>say(`Commande numéro ${o.num}, ${o.table==='E'?'à emporter':'table '+o.table}, c’est prêt !`),900)}

const A={
 start(){sfx('tap');go('mode');say('Bienvenue chez NyGio ! Tu manges sur place ou à emporter ?')},
 mode(d){S.mode=d.v;sfx('tap');if(d.v==='addition'){go('billtable');say('Quelle table veut payer l’addition ?');return}if(d.v==='place'){go('table');say('Sur place. À quelle table ?')}else{S.table=null;go('menu');say('À emporter. Choisis ce que tu veux !')}},
 table(d){S.table=d.v;sfx('tap');say('Table '+d.v+', '+TABLES[d.v].n);go('menu')},
 cat(d){S.cat=d.v;sfx('tap');say(CAT[d.v].name);render()},
 prod(d){openProduct(d.v,d.from)},
 opt(d){const it=ITEM[S.prod];const s=it.sec.find(x=>x.k===d.k);const c=s.choices.find(x=>x.id===d.v);
  if(s.type==='choice'){S.sel[s.k]=d.v;say(c.label)}
  else{const a=S.sel[s.k];const i=a.indexOf(d.v);if(i>=0)a.splice(i,1);else a.push(d.v);
   const l=c.label.toLowerCase();say(s.type==='remove'?(i>=0?'Avec '+l:'Sans '+l):(i>=0?'Pas de supplément '+l:'Supplément '+l))}
  sfx('tap');render()},
 qty(d){S.qty=Math.max(1,Math.min(9,S.qty+Number(d.v)));sfx('tap');say(String(S.qty));render()},
 add(){addToCart()},
 send(){sfx('tap');sendKitchen()},
 billtable(d){const b=billTotal(d.v);if(!b){sfx('err');say('La table '+d.v+' n’a rien à payer');return}S.bill=d.v;sfx('tap');go('bill');say('L’addition de la table '+d.v+' : '+say$(b))},
 back(){const t=backTarget();if(!t)return;sfx('tap');if(S.screen==='product')S.editUid=null;if(t==='welcome'){resetOrder();return}go(t)},
 tab(d){if(S.tab===d.v)return;S.tab=d.v;sfx('tap');render()},
 cart(){sfx('tap');go('cart');say('Ta commande. Total : '+say$(cartTotal()))},
 lqty(d){const l=S.cart.find(x=>x.uid===d.u);if(!l)return;l.qty=Math.max(1,Math.min(9,l.qty+Number(d.v)));sfx('tap');render()},
 ldel(d){const l=S.cart.find(x=>x.uid===d.u);S.cart=S.cart.filter(x=>x.uid!==d.u);sfx('tap');if(l)say(l.name+' enlevé');render()},
 ledit(d){const l=S.cart.find(x=>x.uid===d.u);if(l)openProduct(l.id,'cart',l.uid)},
 upsellOff(){S.upsellOff=true;sfx('tap');render()},
 topay(){if(!payTotal())return;sfx('tap');go('paychoose');say('Ça fait '+say$(payTotal())+'. Tu paies par carte ou en espèces ?')},
 paycard(){S.pay={method:'carte',step:'insert',pin:''};sfx('tap');go('card');say('Pose ta carte sur le terminal')},
 paycash(){S.pay={method:'especes',given:0,pieces:[]};sfx('tap');go('cash');say('Donne tes pièces et tes billets')},
 cardtap(){const p=S.pay;if(!p||p.step!=='insert')return;p.step='tapping';sfx('bip');render();
  setTimeout(()=>{if(S.screen!=='card'||S.pay!==p)return;p.step='pin';say('Tape ton code secret');render()},900)},
 cpk(d){const p=S.pay;if(!p||p.step!=='pin')return;if(d.v==='del')p.pin=p.pin.slice(0,-1);else if(p.pin.length<4){p.pin+=d.v;sfx('key')}render();
  if(p.pin.length===4){setTimeout(()=>{if(S.pay!==p)return;p.step='proc';render();
   setTimeout(()=>{if(S.pay!==p||S.screen!=='card')return;p.step='ok';sfx('ok');say('Paiement accepté');render();
    setTimeout(()=>{if(S.pay===p&&S.screen==='card')finalize()},1500)},1400)},350)}},
 money(d){const v=Number(d.v);S.pay.given+=v;S.pay.pieces.push(v);sfx('coin');say(say$(v));render()},
 mclear(){S.pay.given=0;S.pay.pieces=[];sfx('tap');render()},
 cashok(){const t=payTotal();if(S.pay.given<t){sfx('err');say('Il manque '+say$(t-S.pay.given));return}
  S.pay.change=S.pay.given-t;sfx('ok');go('change');say(S.pay.change?'Je te rends '+say$(S.pay.change):'Compte juste, merci !')},
 finish(){finalize()},
 newOrder(){sfx('tap');resetOrder()},
 cancelOrder(){if(S.bill){confirmBox('Arrêter le paiement ?','L’addition reste ouverte, tu pourras payer plus tard.','Oui, arrêter',()=>{resetOrder()});return}confirmBox('Annuler la commande ?','Tout ce que tu as choisi sera effacé.','Oui, annuler',()=>{resetOrder();say('Commande annulée')},true)},
 kline(d){const o=findO(d.o);if(!o)return;const l=o.lines[Number(d.i)];l.done=!l.done;saveAll();sfx(l.done?'key':'tap');render()},
 ready(d){const o=findO(d.v);if(!o)return;o.status='ready';o.lines.forEach(l=>l.done=true);saveAll();render();announce(o)},
 recall(d){const o=findO(d.v);if(o)announce(o)},
 served(d){const o=findO(d.v);if(!o)return;if(o.paid)orders=orders.filter(x=>x.id!==d.v);else o.status='served';saveAll();sfx('add');say('Bon appétit !');render()},
 kcancel(d){const o=findO(d.v);if(!o)return;confirmBox('Annuler la commande n° '+o.num+' ?','Elle sera retirée de la cuisine.','Oui, annuler',()=>{orders=orders.filter(x=>x.id!==d.v);saveAll()},true)},
 free(d){confirmBox('Libérer la '+tLabel(d.v).toLowerCase()+' ?','Les commandes et l’addition de cette table seront effacées.','Oui, libérer',()=>{orders=orders.filter(o=>o.table!==d.v);saveAll()},true)},
 gear(){sfx('tap');S.modal={type:'pin',v:''};render()},
 pk(d){const m=S.modal;m.err=false;if(d.v==='del')m.v=m.v.slice(0,-1);else if(m.v.length<4){m.v+=d.v;sfx('key')}
  if(m.v.length===4){if(m.v===settings.pin){S.modal={type:'parent'};sfx('ok')}else{m.v='';m.err=true;sfx('err')}}render()},
 mclose(){const m=S.modal;S.modal=m&&m.prev?m.prev:null;lastAct=Date.now();render()},
 mok(){const m=S.modal;S.modal=m.prev||null;if(m.onOk)m.onOk();render()},
 say(d){say(d.v)},
 pset(d){settings[d.k]=!settings[d.k];saveAll();render()},
 savepin(){const el=document.getElementById('newpin');const v=el?el.value.trim():'';if(/^\d{4}$/.test(v)){settings.pin=v;saveAll();toast('Nouveau code enregistré')}else toast('Le code doit avoir 4 chiffres')},
 pprice(d){const it=ITEM[d.id];settings.prices[d.id]=Math.max(0,priceOf(it)+Number(d.d));saveAll();render()},
 phide(d){if(settings.hidden[d.id])delete settings.hidden[d.id];else settings.hidden[d.id]=true;saveAll();render()},
 resetPrices(){confirmBox('Remettre les prix d’origine ?','Tous les prix modifiés reviennent à la carte de départ.','Oui',()=>{settings.prices={};saveAll()})},
 clearOrders(){confirmBox('Effacer toutes les commandes ?','La cuisine sera vidée.','Oui, effacer',()=>{orders=[];saveAll()},true)},
 resetNum(){confirmBox('Recommencer les numéros ?','La prochaine commande aura le numéro 1.','Oui',()=>{counter=0;saveAll()})}
};

/* no zoom */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>{lastAct=Date.now();ac()},{passive:true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,e)});

setInterval(()=>{
 const m=S.modal;
 if(m&&m.type==='idle'){m.count--;if(m.count<=0){S.modal=null;resetOrder()}else render();return}
 if(settings.idle&&S.tab==='order'&&!m&&!['welcome','ticket','card'].includes(S.screen)&&Date.now()-lastAct>60000){S.modal={type:'idle',count:15};sfx('bip');say('Tu es toujours là ?');render()}
},1000);
setInterval(()=>{if(S.tab==='kitchen'&&!S.modal)render()},30000);

render();
})();
</script>
